<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笨居居签名提取</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 1.5rem 1rem;
            background-color: #f8f9fc;
            font-size: 1rem;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #fff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            gap: 1.5rem;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .upload-area {
            width: 100%;
            max-width: 300px;
            height: 120px;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.3s ease;
            padding: 1rem;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1.2rem;
            }
            .controls {
                gap: 1.2rem;
                flex-direction: column;
                align-items: stretch;
            }
            .slider-group {
                width: 100%;
            }
            .upload-area {
                max-width: 100%;
            }
        }
        .upload-area:hover {
            border-color: #2196F3;
            background-color: #f8f9fd;
        }
        .upload-area.dragover {
            border-color: #4CAF50;
            background-color: #f0fff0;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-container input[type="range"] {
            width: 300px; /* 延长滑动条长度 */
        }
        .download-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 10px; /* 进一步缩短下载按钮 */
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.2);
        }
        .download-btn:hover {
            background-color: #1976D2;
            transform: translateY(-1px);
        }
        #downloadWatermarkBtn {
            background-color: #ff0000;
        }
        #downloadWatermarkBtn:hover {
            background-color: #cc0000;
            transform: translateY(-1px);
        }
        .images-display {
            display: grid;
            grid-template-columns: auto auto;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
            margin-top: 1.5rem;
        }
        .image-wrapper {
            position: relative;
            border: 1px solid #ddd;
        }
        .arrow-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arrow-svg {
            width: 40px;
            height: 40px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .crop-rect {
            position: absolute;
            border: 2px solid rgba(255, 0, 0, 0.7);
            box-sizing: border-box;
            cursor: move;
        }
        .crop-rect .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 0, 0, 0.7);
            border: 1px solid rgba(255,255,255,0.9);
        }
        .crop-rect .tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .crop-rect .tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .crop-rect .bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .crop-rect .br { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .crop-rect .tm { top: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .crop-rect .bm { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .crop-rect .ml { top: 50%; left: -5px; transform: translateY(-50%); cursor: ew-resize; }
        .crop-rect .mr { top: 50%; right: -5px; transform: translateY(-50%); cursor: ew-resize; }

        #originalCanvasContainer {
            position: relative; /* Needed for absolute positioning of crop-rect */
        }
    </style>

    <div class="container">
        <h1>笨居居签名提取</h1>

        <div class="controls">
            <div id="uploadArea" class="upload-area">
                点击上传或拖拽图片到此处
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </div>
            <div class="slider-group">
                <div class="slider-container">
                    <label for="thresholdSlider">阈值:</label>
                    <input type="range" id="thresholdSlider" min="0" max="255" value="128">
                    <span id="thresholdValue">128</span>
                    <div class="grayscale-option">
                        <input type="checkbox" id="grayscaleMode">
                        <label for="grayscaleMode">开启黑白模式</label>
                    </div>
                </div>
                <button id="downloadBtn" class="download-btn">下载处理后图片</button>
                <!-- <button id="downloadWatermarkBtn" class="download-btn">下载带水印图片</button> -->

        </div>

        <div class="images-display">
            <div class="image-wrapper" id="originalCanvasContainer">
                <canvas id="originalCanvas"></canvas>
                <div id="cropRect" class="crop-rect" style="display:none;">

                    <div class="handle bl"></div><div class="handle bm"></div><div class="handle br"></div>
                </div>
            </div>
            <div class="image-wrapper">
                <canvas id="processedCanvas"></canvas>
            </div>
        </div>
    </div>
